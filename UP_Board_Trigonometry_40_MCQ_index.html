<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UP Board Trigonometry 40 MCQ</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:14px;color:#222}.box{max-width:800px;margin:auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:23px}.meta{text-align:center;color:#555}.q{padding:17px 0;border-top:1px solid #ddd}label{display:block;padding:11px;background:#f7f7f7;margin:7px 0;border-radius:9px;cursor:pointer}button{width:100%;padding:14px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-size:17px;font-weight:bold;cursor:pointer;margin-top:12px}#result{display:none;margin-top:20px;padding:18px;border-radius:10px;background:#eef7ee}.wrong{background:#fff0f0;padding:10px;margin:7px 0;border-radius:8px}.right{background:#eef7ee;padding:10px;margin:7px 0;border-radius:8px}
</style></head><body><div class="box"><h1>📐 UP Board Trigonometry Test</h1><div class="meta">Class 10–12 • 40 MCQ • Board-focused revision</div><p><b>निर्देश:</b> हर प्रश्न में A, B, C या D में से एक विकल्प चुनें। सभी 40 प्रश्न पूरे करने के बाद Submit करें।</p><form id="quiz"></form><button type="button" onclick="submitQuiz()">SUBMIT TEST</button><div id="result"></div></div>
<script>
const questions=[["यदि tan A = 3/4 है, तो sin A का मान क्या है?", ["3/5", "4/5", "3/4", "5/4"], 0], ["sin 30° का मान है:", ["0", "1/2", "√3/2", "1"], 1], ["cos 60° का मान है:", ["1/2", "√3/2", "1", "0"], 0], ["tan 45° का मान है:", ["0", "1/√3", "1", "√3"], 2], ["sin²A + cos²A बराबर है:", ["0", "1", "2", "tan A"], 1], ["1 + tan²A बराबर है:", ["cosec²A", "cot²A", "sec²A", "sin²A"], 2], ["1 + cot²A बराबर है:", ["sec²A", "cosec²A", "tan²A", "cos²A"], 1], ["cosec A किसके बराबर है?", ["1/sin A", "1/cos A", "1/tan A", "sin A"], 0], ["sec A किसके बराबर है?", ["1/sin A", "1/cos A", "1/tan A", "cos A"], 1], ["cot A किसके बराबर है?", ["sin A/cos A", "cos A/sin A", "1/sin A", "1/cos A"], 1], ["sin(90°−A) बराबर है:", ["sin A", "cos A", "tan A", "cot A"], 1], ["cos(90°−A) बराबर है:", ["sin A", "cos A", "sec A", "cosec A"], 0], ["tan(90°−A) बराबर है:", ["tan A", "cot A", "sec A", "cosec A"], 1], ["यदि sin A = 5/13 है, तो acute A के लिए cos A है:", ["5/12", "12/13", "13/12", "8/13"], 1], ["यदि cos A = 12/13 है, तो tan A है:", ["5/12", "12/5", "5/13", "13/5"], 0], ["यदि tan A = 1/√3 है, तो A (acute) है:", ["30°", "45°", "60°", "90°"], 0], ["sin 60° का मान है:", ["1/2", "1/√2", "√3/2", "1"], 2], ["cos 45° का मान है:", ["1/2", "1/√2", "√3/2", "1"], 1], ["tan 60° का मान है:", ["1/√3", "1", "√3", "2"], 2], ["cosec 30° का मान है:", ["1/2", "1", "2", "√3"], 2], ["sec 60° का मान है:", ["1", "2", "√3", "1/2"], 1], ["cot 45° का मान है:", ["0", "1", "√3", "1/√3"], 1], ["180° radians में है:", ["π/2", "π", "2π", "π/4"], 1], ["90° radians में है:", ["π", "π/2", "π/4", "2π"], 1], ["30° radians में है:", ["π/3", "π/6", "π/4", "π/2"], 1], ["sin(−A) बराबर है:", ["sin A", "−sin A", "cos A", "−cos A"], 1], ["cos(−A) बराबर है:", ["−cos A", "sin A", "cos A", "−sin A"], 2], ["tan(−A) बराबर है:", ["tan A", "−tan A", "cot A", "−cot A"], 1], ["sin(A+B) का सही सूत्र है:", ["sinAcosB+cosAsinB", "sinAcosB−cosAsinB", "cosAcosB−sinAsinB", "tanA+tanB"], 0], ["cos(A+B) का सही सूत्र है:", ["cosAcosB+sinAsinB", "cosAcosB−sinAsinB", "sinAcosB+cosAsinB", "1−tanA tanB"], 1], ["tan(A+B) का सूत्र है:", ["(tanA+tanB)/(1−tanA tanB)", "(tanA−tanB)/(1+tanA tanB)", "tanA+tanB", "1−tanA tanB"], 0], ["sin(A−B) का सूत्र है:", ["sinAcosB+cosAsinB", "sinAcosB−cosAsinB", "cosAcosB+sinAsinB", "sinA−sinB"], 1], ["cos(A−B) का सूत्र है:", ["cosAcosB−sinAsinB", "cosAcosB+sinAsinB", "sinAcosB−cosAsinB", "cosA−cosB"], 1], ["sin 2A बराबर है:", ["sin²A", "2sinAcosA", "2tanA", "1−2sin²A"], 1], ["cos 2A का एक रूप है:", ["2sinAcosA", "cos²A+sin²A", "2cos²A−1", "2tanA"], 2], ["tan 2A बराबर है:", ["2tanA/(1−tan²A)", "tan²A/(1−tanA)", "2tanA/(1+tan²A)", "tanA/2"], 0], ["sin²(A/2) बराबर है:", ["(1+cosA)/2", "(1−cosA)/2", "(1−sinA)/2", "cos²A/2"], 1], ["cos²(A/2) बराबर है:", ["(1−cosA)/2", "(1+cosA)/2", "(1−sinA)/2", "sin²A/2"], 1], ["यदि tan A = 4/3 है, तो sec A है:", ["3/5", "4/5", "5/3", "5/4"], 2]];
const form=document.getElementById("quiz");
questions.forEach((q,i)=>{let d=document.createElement("div");d.className="q";d.innerHTML="<b>"+(i+1)+". "+q[0]+"</b>"+q[1].map((x,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}) ${x}</label>`).join("");form.appendChild(d)});
function submitQuiz(){
 let score=0, unanswered=0, details="";
 questions.forEach((q,i)=>{let x=document.querySelector('input[name="q'+i+'"]:checked');if(!x){unanswered++;details+=`<div class="wrong"><b>${i+1}.</b> Unanswered — सही उत्तर: ${String.fromCharCode(65+q[2])}) ${q[1][q[2]]}</div>`}else if(+x.value===q[2]){score++}else{details+=`<div class="wrong"><b>${i+1}.</b> आपका उत्तर: ${String.fromCharCode(65+ +x.value)} — सही: ${String.fromCharCode(65+q[2])}) ${q[1][q[2]]}</div>`}});
 let pct=Math.round(score/questions.length*100);let msg=pct>=80?"बहुत बढ़िया 🔥":pct>=60?"अच्छा प्रयास 👍":"और practice करो 💪";
 const r=document.getElementById("result");r.style.display="block";r.innerHTML=`<h2>🎉 Result</h2><p><b>Score: ${score} / ${questions.length}</b></p><p>Percentage: <b>${pct}%</b></p><p>${msg}</p><p>Unanswered: ${unanswered}</p><hr><h3>जहाँ गलती हुई / छूटा:</h3>${details||"<div class='right'>सभी answers सही! शानदार! 🏆</div>"}`;r.scrollIntoView({behavior:"smooth"});}
</script></body></html>
